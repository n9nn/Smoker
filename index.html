<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourName</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:#fff;font-family:'Cairo',system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid #fff;outline-offset:3px}
  .wrap{max-width:900px;margin:0 auto;padding:28px 22px 56px}

  /* top */
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:84px}
  .logo{font-weight:900;font-size:1.1rem}
  .pill{background:transparent;color:#fff;border:1px solid #2a2a2a;border-radius:99px;padding:6px 16px;
    font:600 .9rem 'Cairo',sans-serif;cursor:pointer;transition:border-color .2s}
  .pill:hover{border-color:#fff}

  /* hero */
  .hero h1{font-size:clamp(2.3rem,8vw,4.2rem);font-weight:900;line-height:1.2;margin-bottom:16px}
  .hero h1 em{font-style:normal;color:#7a7a7a}
  .hero p{color:#8a8a8a;font-size:1.1rem;max-width:520px;margin-bottom:34px}
  .actions{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 28px;border-radius:99px;
    font-weight:700;background:#fff;color:#000;border:1px solid #fff;transition:background .2s,transform .2s}
  .btn:hover{background:#d6d6d6;border-color:#d6d6d6;transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:#fff;border-color:#2a2a2a}
  .btn.ghost:hover{border-color:#fff;background:transparent}

  /* sections */
  section{margin-top:96px}
  .label{font-size:.95rem;font-weight:700;color:#6b6b6b;padding-bottom:12px;border-bottom:1px solid #1a1a1a;margin-bottom:24px}

  /* game cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{display:flex;flex-direction:column;gap:18px;background:#0a0a0a;border:1px solid #1e1e1e;border-radius:20px;
    padding:26px;transition:border-color .2s,transform .2s}
  .card:hover{border-color:#fff;transform:translateY(-3px)}
  .gname{font-size:1.45rem;font-weight:800;line-height:1.3}
  .tags{display:flex;flex-wrap:wrap;gap:8px;flex:1;align-content:flex-start}
  .tags span{font-size:.8rem;color:#bdbdbd;border:1px solid #2a2a2a;border-radius:99px;padding:2px 12px}
  .go{font-size:.9rem;font-weight:700;color:#fff;border-top:1px solid #1e1e1e;padding-top:14px}

  .note{margin-top:28px;color:#5e5e5e;font-size:.85rem;border-inline-start:2px solid #2a2a2a;padding-inline-start:14px}
  footer{margin-top:96px;padding-top:24px;border-top:1px solid #1a1a1a;color:#5e5e5e;font-size:.85rem;text-align:center}

  @media (max-width:560px){ .top{margin-bottom:50px} section{margin-top:72px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main class="wrap">

  <header class="top">
    <span class="logo" id="logo"></span>
    <button class="pill" id="lang" type="button"></button>
  </header>

  <section class="hero" style="margin-top:0">
    <h1 id="title"></h1>
    <p id="intro"></p>
    <div class="actions">
      <a class="btn" id="btnPrimary" href="#" target="_blank" rel="noopener"></a>
      <a class="btn ghost" id="btnServer" href="#" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <section>
    <h2 class="label" id="gamesT"></h2>
    <div class="grid" id="games"></div>
  </section>

  <p class="note" id="note"></p>

  <footer id="foot"></footer>
</main>

<script>
  /* ============ ✏️ عدّل هنا / EDIT HERE ============ */
  var NAME    = "Smoker";
  var PROFILE = "https://discord.com/users/wqfa";      // رابط حسابك الشخصي
  var DISCORD = "https://discord.gg/Gx68jt8e9N";         // رابط السيرفر (اختياري)

  // الميزات: اكتب بس اللي منتجك يسويه فعلاً
  var F = {
    esp:     { en: "ESP",                    ar: "كشف الأماكن" },
    aim:     { en: "Aimbot",                 ar: "إيم بوت" },
    trig:    { en: "Triggerbot",             ar: "ترقر بوت" },
    radar:   { en: "Radar",                  ar: "رادار" },
    recoil:  { en: "Recoil Control",         ar: "تحكم بالارتداد" },
    bhop:    { en: "Bunny Hop",              ar: "بني هوب" },
    noflash: { en: "No Flash",               ar: "بدون تعمية" },
    skins:   { en: "Skin Changer",           ar: "تغيير السكنات" },
    tracker: { en: "Cooldown Tracker",       ar: "تتبع الكولداون" },
    autouse: { en: "Auto Item Use",          ar: "استخدام تلقائي للعناصر" },
    lasthit: { en: "Auto Last Hit",          ar: "لاست هت تلقائي" },
    skill:   { en: "Skillshot Prediction",   ar: "توقع المهارات" },
    stab:    { en: "Auto Backstab",          ar: "باك ستاب تلقائي" },
    blast:   { en: "Auto Airblast",          ar: "إيربلاست تلقائي" },
    predict: { en: "Projectile Prediction",  ar: "توقع المقذوفات" }
  };

  // الألعاب: name = الاسم، feats = رموز الميزات من F
  var GAMES = [
    { name: "Valorant", feats: ["esp", "aim", "trig", "radar", "recoil"] },
    { name: "CS2",      feats: ["esp", "aim", "trig", "radar", "recoil", "bhop", "noflash", "skins"] },
    { name: "Dota 2",   feats: ["esp", "tracker", "autouse", "lasthit", "skill"] },
    { name: "TF2",      feats: ["esp", "aim", "trig", "bhop", "stab", "blast", "predict"] }
  ];
  /* ================================================= */

  var T = {
    ar: {
      title: "هلا، أني {n}.<br><em>أبرمج هاكات ألعاب.</em>",
      intro: "مطور فردي. أبرمج كل شي بنفسي وأرد على كل رسالة بنفسي.",
      btn: "راسلني على ديسكورد", server: "انضم للسيرفر",
      gamesT: "الألعاب", go: "راسلني للشراء",
      note: "الاستخدام على مسؤوليتك، وقد يؤدي لحظر الحساب.",
      other: "English"
    },
    en: {
      title: "Hi, I'm {n}.<br><em>I make game hacks.</em>",
      intro: "Solo developer. I write everything myself and answer every message myself.",
      btn: "Message me on Discord", server: "Join the server",
      gamesT: "Games", go: "Message me to buy",
      note: "Use at your own risk. It may get your account banned.",
      other: "العربية"
    }
  };

  var d = document.documentElement, lang = "ar";
  try { lang = localStorage.getItem("lang") || ((navigator.language || "").indexOf("ar") === 0 ? "ar" : "en"); } catch (e) {}

  function $(id) { return document.getElementById(id); }

  function renderGames(x) {
    $("games").innerHTML = GAMES.map(function (g) {
      var tags = g.feats.map(function (k) { return "<span>" + F[k][x] + "</span>"; }).join("");
      return '<a class="card" href="' + PROFILE + '" target="_blank" rel="noopener">' +
             '<div class="gname">' + g.name + '</div>' +
             '<div class="tags">' + tags + '</div>' +
             '<div class="go">' + T[x].go + '</div></a>';
    }).join("");
  }

  function set(x) {
    var t = T[x];
    lang = x;
    d.lang = x; d.dir = x === "ar" ? "rtl" : "ltr";
    document.title = NAME;
    $("logo").textContent = NAME;
    $("title").innerHTML = t.title.replace("{n}", NAME);
    $("intro").textContent = t.intro;
    $("btnPrimary").textContent = t.btn;
    $("btnPrimary").href = PROFILE;
    $("btnServer").textContent = t.server;
    $("btnServer").href = DISCORD;
    $("gamesT").textContent = t.gamesT;
    $("note").textContent = t.note;
    $("foot").textContent = "© " + new Date().getFullYear() + " " + NAME;
    $("lang").textContent = t.other;
    renderGames(x);
    try { localStorage.setItem("lang", x); } catch (e) {}
  }

  $("lang").addEventListener("click", function () { set(lang === "ar" ? "en" : "ar"); });
  set(lang === "en" ? "en" : "ar");
</script>
</body>
</html>
