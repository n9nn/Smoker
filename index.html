<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solo dev</title>
<meta name="theme-color" content="#08070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<script>
  (function(){
    var l=null;
    try{l=localStorage.getItem("lang");}catch(e){}
    if(l!=="ar"&&l!=="en"){l=(navigator.language||"").toLowerCase().indexOf("ar")===0?"ar":"en";}
    var d=document.documentElement;d.lang=l;d.dir=l==="ar"?"rtl":"ltr";
  })();
</script>
<style>
  :root{
    color-scheme:dark;
    --bg:#08070c; --line:#241f33; --soft:#12101b;
    --text:#f2f0fa; --muted:#968fb8;
    --accent:#ff3d83; --accent2:#46e3e8; --warn:#f0b429;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.85;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
  ::selection{background:var(--accent);color:#fff}
  .col{max-width:760px;margin:0 auto;padding:0 22px}

  /* top bar */
  .top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
  .handle{font-weight:900;font-size:1.15rem}
  .handle i{font-style:normal;color:var(--accent)}
  .lang-btn{background:none;border:1px solid var(--line);color:var(--text);cursor:pointer;
    height:38px;padding:0 14px;border-radius:99px;font:700 .9rem 'Cairo',sans-serif;transition:border-color .15s}
  .lang-btn:hover{border-color:var(--accent2)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:#fff;
    font:800 1rem 'Cairo',sans-serif;padding:11px 24px;border-radius:99px;border:2px solid var(--accent);
    cursor:pointer;transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,61,131,.35)}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--accent2);box-shadow:none}
  .btn svg{width:20px;height:20px;fill:currentColor;flex:none}

  /* hero */
  .hero{padding:56px 0 70px}
  .me{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .avatar{width:58px;height:58px;border-radius:50%;background:var(--accent);display:grid;place-items:center;
    font-weight:900;font-size:1.5rem;overflow:hidden;flex:none;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .status{color:var(--muted);font-size:.95rem;display:flex;align-items:center;gap:8px}
  .status::before{content:"";width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.18)}
  .hero h1{font-size:clamp(2.2rem,7vw,3.8rem);font-weight:900;line-height:1.25;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .hero h1 em{font-style:normal;color:var(--accent2)}
  .hero p{color:var(--muted);font-size:1.15rem;margin:18px 0 30px;max-width:540px;animation:rise .7s .12s both}
  .actions{display:flex;gap:12px;flex-wrap:wrap;animation:rise .7s .24s both}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  section{padding:54px 0;border-top:1px solid var(--line)}
  h2{font-size:1.6rem;font-weight:800;margin-bottom:18px}
  .about p{color:var(--muted);font-size:1.1rem;margin-bottom:12px}
  .about p b{color:var(--text)}

  /* products as rows */
  .row{display:grid;grid-template-columns:1fr auto;gap:6px 20px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center}
  .row:first-of-type{border-top:1px solid var(--line)}
  .row h3{font-size:1.25rem;line-height:1.4}
  .row .game{color:var(--muted);font-size:.95rem}
  .row .feat{grid-column:1;color:var(--muted);font-size:.95rem}
  .row .feat span::after{content:"•";margin-inline:8px;color:var(--line)}
  .row .feat span:last-child::after{content:""}
  .row .buy{grid-column:2;grid-row:1 / span 3;text-align:center}
  .row .price{font-size:1.6rem;font-weight:900;margin-bottom:6px;white-space:nowrap}
  .row .price small{font-size:.8rem;color:var(--muted);font-weight:600}
  .tag{display:inline-block;font-size:.75rem;font-weight:700;padding:0 10px;border-radius:99px;border:1px solid var(--accent2);
    color:var(--accent2);margin-inline-start:10px;vertical-align:middle}
  .tag.updating{border-color:var(--warn);color:var(--warn)}
  @media(max-width:560px){
    .row{grid-template-columns:1fr}
    .row .buy{grid-column:1;grid-row:auto;text-align:start;margin-top:8px}
    .row .btn{width:100%}
  }

  /* changelog */
  .log{list-style:none;display:grid;gap:14px}
  .log li{display:grid;grid-template-columns:96px 1fr;gap:14px}
  .log time{color:var(--accent2);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
  .log span{color:var(--muted)}

  /* faq */
  details{border-bottom:1px solid var(--line);padding:16px 0}
  summary{cursor:pointer;font-weight:700}
  details[open] summary{color:var(--accent2)}
  details p{color:var(--muted);margin-top:8px}
  .warn{margin-top:22px;padding:14px 18px;border-inline-start:3px solid var(--warn);background:var(--soft);color:var(--muted);font-size:.95rem}

  /* contact */
  .contact{text-align:center}
  .contact p{color:var(--muted);margin-bottom:22px}
  .tagbox{display:inline-flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);
    border-radius:99px;padding:6px 8px 6px 20px;margin-bottom:22px;direction:ltr;font-weight:700}
  .tagbox button{background:var(--line);color:var(--text);border:0;border-radius:99px;padding:6px 14px;
    cursor:pointer;font:700 .85rem 'Cairo',sans-serif}
  .tagbox button:hover{background:var(--accent2);color:#000}
  .contact .actions{justify-content:center}

  footer{padding:28px 0 40px;text-align:center;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="col">
  <div class="top">
    <a class="handle" href="#"><span id="handleTxt"></span><i>_</i></a>
    <button class="lang-btn" id="langBtn" type="button" aria-label="Language"></button>
  </div>

  <header class="hero">
    <div class="me">
      <div class="avatar" id="avatar"></div>
      <div class="status" data-i18n="status"></div>
    </div>
    <h1 data-i18n-html="hero_title"></h1>
    <p data-i18n="hero_sub"></p>
    <div class="actions">
      <a class="btn discord-link" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/></svg>
        <span data-i18n="dm"></span>
      </a>
      <a class="btn ghost" href="#products" data-i18n="see"></a>
    </div>
  </header>

  <section class="about">
    <h2 data-i18n="about_t"></h2>
    <p data-i18n-html="about_1"></p>
    <p data-i18n="about_2"></p>
  </section>

  <section id="products">
    <h2 data-i18n="products_t"></h2>
    <div id="productList"></div>
  </section>

  <section>
    <h2 data-i18n="log_t"></h2>
    <ul class="log" id="logList"></ul>
  </section>

  <section>
    <h2 data-i18n="faq_t"></h2>
    <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
    <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
    <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
    <div class="warn" data-i18n="risk"></div>
  </section>

  <section class="contact">
    <h2 data-i18n="contact_t"></h2>
    <p data-i18n="contact_p"></p>
    <div class="tagbox"><span id="tagTxt"></span><button id="copyBtn" type="button"></button></div>
    <div class="actions">
      <a class="btn discord-link" href="#" target="_blank" rel="noopener" data-i18n="open_dc"></a>
    </div>
  </section>

  <footer>© <span id="yr"></span> <span id="footName"></span> — <span data-i18n="made"></span></footer>
</div>

<script>
/* ============ ✏️ عدّل هنا / EDIT HERE ============ */
const NAME        = "YourName";                       // اسمك أو اسمك المستعار
const DISCORD_URL = "https://discord.gg/YOUR_INVITE_CODE";
const DISCORD_TAG = "yourname";                       // يوزر الديسكورد حقك
const AVATAR_URL  = "";                               // رابط صورتك (اختياري). فاضي = حرف من اسمك

// منتجاتك (status: "ok" أو "updating")
const PRODUCTS = [
  { status:"ok", price:"$10", period:{en:"/ month", ar:"/ شهر"},
    game:{en:"Game One", ar:"اللعبة الأولى"}, name:{en:"Starter", ar:"الأساسي"},
    features:{en:["Feature one","Feature two","Feature three"], ar:["ميزة أولى","ميزة ثانية","ميزة ثالثة"]} },
  { status:"ok", price:"$25", period:{en:"/ month", ar:"/ شهر"},
    game:{en:"Game Two", ar:"اللعبة الثانية"}, name:{en:"Pro", ar:"الاحترافي"},
    features:{en:["Feature one","Feature two","Feature three","Feature four"], ar:["ميزة أولى","ميزة ثانية","ميزة ثالثة","ميزة رابعة"]} },
  { status:"updating", price:"$40", period:{en:"/ lifetime", ar:"/ دائم"},
    game:{en:"Game Three", ar:"اللعبة الثالثة"}, name:{en:"Ultimate", ar:"المميز"},
    features:{en:["Feature one","Feature two","Priority support"], ar:["ميزة أولى","ميزة ثانية","دعم أولوية"]} }
];

// سجل التحديثات: أضف سطر جديد كل ما تحدّث شي (يخلي الموقع يبين حي)
const CHANGELOG = [
  { date:"2026-10-25", text:{en:"Game Two: updated after the latest patch.", ar:"اللعبة الثانية: تحديث بعد آخر باتش."} },
  { date:"2026-10-18", text:{en:"Game One: added a new feature and fixed a bug.", ar:"اللعبة الأولى: أضفت ميزة جديدة وصلحت مشكلة."} },
  { date:"2026-10-05", text:{en:"Game Three: started working on the update.", ar:"اللعبة الثالثة: بدأت أشتغل على التحديث."} }
];
/* ================================================= */

const T = {
  en:{
    status:"Online on Discord", dm:"Message me on Discord", see:"See what I make",
    hero_title:"Hi, I'm <em>{name}</em>.<br>I make game hacks.",
    hero_sub:"Independent developer. I write every product myself, and I answer every message myself.",
    about_t:"About me",
    about_1:"I'm a <b>solo developer</b>. No team, no reseller, no middleman. I write the code, I test it, and I fix it when a game updates.",
    about_2:"If you buy something and have a problem, you message me on Discord and I reply. That's the whole setup.",
    products_t:"What I'm selling",
    log_t:"Latest updates",
    faq_t:"Before you buy",
    q1:"How do I buy?", a1:"Message me on Discord, tell me which product you want, and I'll send the payment details.",
    q2:"When do I get it?", a2:"After I confirm your payment, I send the download and setup steps.",
    q3:"What if the game updates?", a3:"Check the status tag and the updates list above. I push a fix as soon as I can.",
    risk:"Heads up: using third-party software can break a game's rules and may get an account banned. Use it at your own risk.",
    contact_t:"Talk to me", contact_p:"Easiest way to reach me is Discord.",
    open_dc:"Open Discord", copy:"Copy", copied:"Copied ✓",
    made:"Built by hand, by me.",
    ok:"Working", updating:"Updating", buy:"Buy on Discord", other_lang:"العربية",
    page_title:"{name} | Game hacks developer"
  },
  ar:{
    status:"متصل على ديسكورد", dm:"راسلني على ديسكورد", see:"شوف شغلي",
    hero_title:"هلا، أني <em>{name}</em>.<br>أبرمج هاكات ألعاب.",
    hero_sub:"مطور مستقل. أبرمج كل منتج بنفسي، وأرد على كل رسالة بنفسي.",
    about_t:"عني",
    about_1:"أني <b>مطور فردي</b>. ما عندي فريق ولا وسيط ولا ريسيلر. أكتب الكود وأختبره وأصلحه إذا اللعبة تحدثت.",
    about_2:"إذا اشتريت وصارت عندك مشكلة، تراسلني على ديسكورد وأرد عليك. هذا كل شي.",
    products_t:"اللي أبيعه",
    log_t:"آخر التحديثات",
    faq_t:"قبل ما تشتري",
    q1:"شلون أشتري؟", a1:"راسلني على ديسكورد، قلي أي منتج تريد، وأرسللك تفاصيل الدفع.",
    q2:"متى أستلم؟", a2:"بعد ما أتأكد من الدفع أرسللك التحميل وخطوات التشغيل.",
    q3:"شنو يصير إذا اللعبة تحدثت؟", a3:"شوف شارة الحالة وقائمة التحديثات فوق. أنزل الإصلاح بأسرع وقت.",
    risk:"تنبيه: استخدام برامج طرف ثالث قد يخالف قوانين اللعبة وقد يؤدي لحظر الحساب. الاستخدام على مسؤوليتك.",
    contact_t:"احجي وياي", contact_p:"أسهل طريقة توصلني هي ديسكورد.",
    open_dc:"افتح ديسكورد", copy:"نسخ", copied:"تم النسخ ✓",
    made:"مبرمج بإيدي، من أني.",
    ok:"يشتغل", updating:"قيد التحديث", buy:"اشتري عبر ديسكورد", other_lang:"English",
    page_title:"{name} | مطور هاكات ألعاب"
  }
};

const root = document.documentElement;
const $ = s => document.querySelector(s);
const fill = s => s.replace(/\{name\}/g, NAME);

function renderProducts(l){
  $("#productList").innerHTML = PRODUCTS.map(p => `
    <div class="row">
      <div>
        <h3>${p.name[l]}<span class="tag ${p.status==='updating'?'updating':''}">${T[l][p.status]}</span></h3>
        <div class="game">${p.game[l]}</div>
      </div>
      <div class="feat">${p.features[l].map(f=>`<span>${f}</span>`).join("")}</div>
      <div class="buy">
        <div class="price">${p.price} <small>${p.period[l]}</small></div>
        <a class="btn discord-link" href="${DISCORD_URL}" target="_blank" rel="noopener">${T[l].buy}</a>
      </div>
    </div>`).join("");
}
function renderLog(l){
  $("#logList").innerHTML = CHANGELOG.map(c => `<li><time>${c.date}</time><span>${c.text[l]}</span></li>`).join("");
}

function setLang(l){
  root.lang = l; root.dir = l==="ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = fill(T[l][e.dataset.i18n]));
  document.querySelectorAll("[data-i18n-html]").forEach(e => e.innerHTML = fill(T[l][e.dataset.i18nHtml]));
  $("#langBtn").textContent = T[l].other_lang;
  $("#copyBtn").textContent = T[l].copy;
  document.title = fill(T[l].page_title);
  renderProducts(l); renderLog(l);
  try{ localStorage.setItem("lang", l); }catch(e){}
}

$("#handleTxt").textContent = NAME;
$("#footName").textContent = NAME;
$("#tagTxt").textContent = DISCORD_TAG;
$("#avatar").innerHTML = AVATAR_URL ? `<img src="${AVATAR_URL}" alt="${NAME}">` : NAME.charAt(0).toUpperCase();
$("#yr").textContent = new Date().getFullYear();

$("#langBtn").addEventListener("click", () => setLang(root.lang==="ar" ? "en" : "ar"));
$("#copyBtn").addEventListener("click", () => {
  const done = () => { $("#copyBtn").textContent = T[root.lang].copied;
    setTimeout(()=>{ $("#copyBtn").textContent = T[root.lang].copy; }, 1800); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(DISCORD_TAG).then(done, done);
  } else { done(); }
});

document.querySelectorAll(".discord-link").forEach(a => a.href = DISCORD_URL);
setLang(root.lang === "en" ? "en" : "ar");
</script>
</body>
</html>
