<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourName</title>
<meta name="theme-color" content="#000000">
<style>
  :root{color-scheme:dark;--bg:#000;--card:#0d0d0d;--line:#2b2b2b;--text:#fff;--muted:#9a9a9a;--accent:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
    line-height:1.8;padding:24px 20px 40px}
  main{max-width:520px;margin:0 auto}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid #fff;outline-offset:3px}

  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}
  .logo{font-weight:800;font-size:1.2rem}
  .logo b{color:var(--accent)}
  #lang{background:none;border:1px solid var(--line);color:var(--text);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}
  #lang:hover{border-color:var(--accent)}

  h1{font-size:2.2rem;line-height:1.3;margin-bottom:10px}
  h1 em{font-style:normal;color:var(--muted)}
  .intro{color:var(--muted);margin-bottom:34px}

  h2{font-size:1.1rem;color:var(--muted);font-weight:600;margin-bottom:12px}
  .game{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-bottom:10px;transition:border-color .15s,transform .15s}
  .game:hover{border-color:var(--accent);transform:translateY(-2px)}
  .game .head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.15rem}
  .game small{color:var(--muted);font-weight:600;font-size:.9rem}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tags span{border:1px solid var(--line);border-radius:99px;padding:1px 12px;font-size:.85rem;color:var(--muted)}

  .btn{display:block;text-align:center;background:#fff;color:#000;font-weight:700;
    padding:14px;border-radius:99px;margin-top:26px;transition:background .15s}
  .btn:hover{background:#d9d9d9}
  .note{margin-top:22px;text-align:center;color:#6b6b6b;font-size:.85rem}
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="logo"><span id="logoName"></span><b>_</b></span>
    <button id="lang" type="button"></button>
  </div>

  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>

  <h2 id="gamesT"></h2>
  <div id="games"></div>

  <a class="btn dc" href="#" target="_blank" rel="noopener" id="btn"></a>
  <p class="note" id="note"></p>
</main>

<script>
  // ✏️ عدّل هنا
  var NAME = "Smoker";
  var DISCORD = "https://discord.gg/JnZUAbmTC6";

  // الألعاب وميزاتها: عدّل الأسماء أو أضف/احذف ميزة
  var F = {
    esp:   { en: "ESP",         ar: "كشف الأماكن" },
    aim:   { en: "Aimbot",      ar: "إيم بوت" },
    trig:  { en: "Triggerbot",  ar: "ترقر بوت" },
    radar: { en: "Radar",       ar: "رادار" },
    recoil:{ en: "No Recoil",   ar: "بدون ارتداد" },
    bhop:  { en: "Bunny Hop",   ar: "بني هوب" },
    map:   { en: "Map Hack",    ar: "كشف الخريطة" }
  };
  var GAMES = [
    { name: "Valorant", feats: ["esp", "aim", "trig", "radar"] },
    { name: "CS2",      feats: ["esp", "aim", "trig", "radar", "recoil"] },
    { name: "Dota 2",   feats: ["map", "esp"] },
    { name: "TF2",      feats: ["esp", "aim", "trig", "bhop"] }
  ];

  var T = {
    ar: { title: "هلا، أني {n}.<br><em>أبرمج هاكات ألعاب.</em>",
          intro: "مطور فردي. أبرمج كل شي بنفسي وأرد على كل رسالة بنفسي.",
          gamesT: "الألعاب", go: "ديسكورد ←", btn: "راسلني على ديسكورد",
          note: "الاستخدام على مسؤوليتك، وقد يؤدي لحظر الحساب.", other: "English" },
    en: { title: "Hi, I'm {n}.<br><em>I make game hacks.</em>",
          intro: "Solo developer. I write everything myself and answer every message myself.",
          gamesT: "Games", go: "Discord →", btn: "Message me on Discord",
          note: "Use at your own risk. It may get your account banned.", other: "العربية" }
  };

  var d = document.documentElement, l = "ar";
  try { l = localStorage.getItem("lang") || ((navigator.language || "").indexOf("ar") === 0 ? "ar" : "en"); } catch (e) {}

  function $(id) { return document.getElementById(id); }

  function renderGames(x) {
    $("games").innerHTML = GAMES.map(function (g) {
      return '<a class="game" href="' + DISCORD + '" target="_blank" rel="noopener">' +
        '<div class="head">' + g.name + ' <small>' + T[x].go + '</small></div>' +
        '<div class="tags">' + g.feats.map(function (k) { return '<span>' + F[k][x] + '</span>'; }).join("") + '</div></a>';
    }).join("");
  }

  function set(x) {
    l = x; d.lang = x; d.dir = x === "ar" ? "rtl" : "ltr";
    $("title").innerHTML = T[x].title.replace("{n}", NAME);
    $("intro").textContent = T[x].intro;
    $("gamesT").textContent = T[x].gamesT;
    $("btn").textContent = T[x].btn;
    $("note").textContent = T[x].note;
    $("lang").textContent = T[x].other;
    renderGames(x);
    try { localStorage.setItem("lang", x); } catch (e) {}
  }

  document.title = NAME;
  $("logoName").textContent = NAME;
  document.querySelectorAll(".dc").forEach(function (a) { a.href = DISCORD; });
  $("lang").onclick = function () { set(l === "ar" ? "en" : "ar"); };
  set(l);
</script>
</body>
</html>
